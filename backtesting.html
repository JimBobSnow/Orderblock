<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Backtesting Results — BO Tracker</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="backtesting">
  <main class="container">
    <section class="page-intro">
      <h1>Backtesting Results</h1>
      <p class="hint">Log backtest runs the same way as live trades — one screenshot, win or loss, and tags per trade.</p>
    </section>

    <section class="list-header-row">
      <h2>Latest sessions</h2>
      <div class="list-header-actions">
        <button type="button" id="edit-tags-btn" class="btn btn-ghost">✏ Edit tags</button>
        <button type="button" id="start-session-btn" class="btn btn-primary">+ Upload session</button>
      </div>
    </section>
    <div class="filter-group">
      <div class="filter-label-row">
        <span class="filter-label">Tag</span>
        <div class="segmented segmented-sm" id="tag-match-toggle">
          <button type="button" data-mode="subset" class="active">Contains selected</button>
          <button type="button" data-mode="exact">Exact match</button>
        </div>
      </div>
      <div id="filter-bar" class="tag-row filter-row"></div>
    </div>
    <div class="filter-group">
      <span class="filter-label">Uploader</span>
      <div id="uploader-filter-bar" class="tag-row filter-row"></div>
    </div>
    <div id="entry-empty" class="empty-state hidden">No backtesting sessions yet — click "Upload session" to add the first one.</div>
    <div id="entry-list" class="entry-list"></div>
  </main>

  <script type="module" src="js/shell.js"></script>
  <script type="module">
    import { initEntryPage } from './js/entries.js';
    initEntryPage({
      dataPath: 'data/backtests.json',
      imageDir: 'images/backtests',
      entryNoun: 'backtest',
      commitPrefix: 'Backtesting'
    });
  </script>
</body>
</html>
