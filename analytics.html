<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Analytics — BO Tracker</title>
<link rel="stylesheet" href="css/style.css" />
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
</head>
<body data-page="analytics">
  <main class="container">
    <section class="page-intro">
      <h1>Analytics</h1>
      <p class="hint">See how each tag and each trader performs, across trading and backtesting.</p>
    </section>

    <section class="card controls-card">
      <div class="controls-row">
        <div class="segmented" id="source-toggle">
          <button type="button" data-source="trading" class="active">Trading only</button>
          <button type="button" data-source="backtesting">Backtesting only</button>
        </div>
      </div>
    </section>

    <section class="card stats-summary" id="summary-cards"></section>

    <section class="card perf-card">
      <div class="perf-header"><span class="perf-icon">🎯</span><h2>Tag Performance</h2></div>
      <div class="perf-body">
        <div class="perf-chart-wrap"><canvas id="chart-tags"></canvas></div>
        <div class="perf-best tag-flavor" id="best-tag-card"></div>
      </div>
      <div class="perf-table-wrap"><table class="data-table" id="tag-table"></table></div>
    </section>

    <section class="card perf-card">
      <div class="perf-header"><span class="perf-icon">👤</span><h2>Uploader Performance</h2></div>
      <div class="perf-body">
        <div class="perf-chart-wrap"><canvas id="chart-uploaders"></canvas></div>
        <div class="perf-best uploader-flavor" id="best-uploader-card"></div>
      </div>
      <div class="perf-table-wrap"><table class="data-table" id="uploader-table"></table></div>
    </section>

    <section class="card">
      <h2>Overview</h2>
      <div class="pie-row">
        <div class="pie-block">
          <h3>Win / loss split</h3>
          <div class="pie-canvas-wrap"><canvas id="chart-winloss-pie"></canvas></div>
        </div>
        <div class="pie-block">
          <h3>Trade share by uploader</h3>
          <div class="pie-canvas-wrap"><canvas id="chart-uploader-pie"></canvas></div>
        </div>
      </div>
    </section>
  </main>

  <script type="module" src="js/shell.js"></script>
  <script type="module" src="js/analytics.js"></script>
</body>
</html>
